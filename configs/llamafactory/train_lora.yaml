### Model
model_name_or_path: Qwen/Qwen2-1.5B-Instruct

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16

### Dataset
dataset: hvnb_transcripts
dataset_dir: configs/llamafactory
template: qwen
cutoff_len: 2048
max_samples: 500
overwrite_cache: true
preprocessing_num_workers: 4

### Output
output_dir: data/Step-4-Training/output/qwen2-1.5b-lora-hvnb
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true

### Training Hyperparameters
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: false  # CPU doesn't support bf16, use fp32

### Evaluation
val_size: 0.0  # No validation split - data already held out
eval_strategy: "no"
